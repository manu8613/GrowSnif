configuration:
  gateway_host:
    name: RS485-TCP gateway host
    description: IP or hostname of the gateway in transparent TCP Server mode. Required.
  gateway_port:
    name: Gateway port
    description: Gateway TCP port.
  meter_address:
    name: Meter Modbus address
    description: Address of the CHINT on the bus (shown on its display, NO. menu).
  ct_ratio:
    name: Current transformer ratio
    description: Primary/secondary, e.g. 400/5 A = 80. Use 1 for direct-connection meters.
  pt_ratio:
    name: Voltage transformer ratio
    description: Usually 1 (no voltage transformers).
  invert_power_sign:
    name: Invert power sign
    description: Enable if power is negative while importing from the grid.
  publish_interval:
    name: Publish interval (s)
    description: Minimum time between fast power updates.
  id_prefix:
    name: Entity prefix
    description: Builds entity_ids (sensor.<prefix>_...) and MQTT topics. Reuse an old prefix to keep history.
  device_name:
    name: Device name
    description: Name shown in Home Assistant.
  discovery_prefix:
    name: MQTT Discovery prefix
    description: Keep homeassistant unless you changed it in the MQTT integration.
  mqtt_host:
    name: MQTT host (optional)
    description: Empty = automatic credentials from the Supervisor (Mosquitto).
  mqtt_port:
    name: MQTT port (optional)
    description: Only if you set the host.
  mqtt_username:
    name: MQTT username (optional)
    description: Empty = automatic.
  mqtt_password:
    name: MQTT password (optional)
    description: Empty = automatic.
  log_level:
    name: Log level
    description: info recommended.
  inverter_enabled:
    name: Inverter - enable
    description: Also listen to the datalogger ↔ Growatt inverter bus through a second gateway channel. Off changes nothing.
  inverter_host:
    name: Inverter - gateway host
    description: Empty = same as gateway_host (multi-channel gateway).
  inverter_port:
    name: Inverter - channel port
    description: TCP port of the channel wired to the inverter bus. Must differ from the meter one.
  inverter_address:
    name: Inverter - Modbus address
    description: Inverter address on its bus (shown on its display or in the datalogger web page). Usually 1.
  inverter_mppts:
    name: Inverter - number of MPPTs
    description: MPPT inputs to show (1-16). See the inverter datasheet.
  inverter_strings:
    name: Inverter - number of strings
    description: Strings to monitor (0-32). 0 = no per-string sensors and no disconnected-string report.
  inverter_id_prefix:
    name: Inverter - entity prefix
    description: Builds the entity_id (sensor.<prefix>_...). Must differ from id_prefix.
  inverter_device_name:
    name: Inverter - device name
    description: Name shown in Home Assistant.
  panel_install:
    name: Panel - install
    description: Creates the control panel dashboard (Control, Savings, Impact) and keeps the card updated. Needs the config and API permissions, used only when this is on.
  panel_mode:
    name: Panel - mode
    description: 'una_vez: created once, your later changes are kept. gestionado: these options rule and the dashboard is rewritten when they change, after a backup in /config/growsnif/backups.'
  panel_url:
    name: Panel - URL path
    description: Dashboard path with at least one dash (e.g. growsnif-control).
  panel_title:
    name: Panel - title
    description: Header title.
  panel_subtitle:
    name: Panel - subtitle
    description: Text under the title (optional).
  panel_sidebar_title:
    name: Panel - sidebar name
    description: Dashboard name in the Home Assistant menu.
  panel_icon:
    name: Panel - icon
    description: mdi icon for the menu (e.g. mdi:transmission-tower).
  panel_nominal_power:
    name: Panel - nominal power (W)
    description: Inverter nominal power in watts.
  panel_strings_per_mppt:
    name: Panel - strings per MPPT
    description: 0 = automatic split between MPPTs.
  panel_zero_export:
    name: Panel - zero export
    description: Warns when power is exported to the grid.
  panel_lines:
    name: Panel - metered lines
    description: 'One per line: name, power (power entity) and optionally code, energy, current and max (W).'
  panel_savings:
    name: Panel - Savings tab
    description: Hour by hour savings with the price of each tariff period.
  panel_impact:
    name: Panel - Impact tab
    description: Avoided CO₂ and equivalences.
  panel_price_entities:
    name: Panel - prices P1 to P6
    description: Six entities with the energy price of each period (€/kWh), in order.
  panel_price_kwh:
    name: Panel - single price (€/kWh)
    description: If you do not have six prices. 0 = no price.
  panel_price_now_entity:
    name: Panel - current price
    description: Entity with the current energy price (optional).
  panel_cost_entity:
    name: Panel - accumulated cost
    description: Accumulated energy cost entity, to compare with what you paid (optional).
  panel_tax_factor:
    name: Panel - tax factor
    description: Multiplies savings. 1 = no taxes.
  panel_co2_entity:
    name: Panel - CO₂ intensity
    description: Entity in g/kWh (e.g. Electricity Maps), optional.
  panel_co2_factor:
    name: Panel - CO₂ per kWh (g)
    description: Fixed value when there is no CO₂ entity.
  panel_pf_min:
    name: Alarm - minimum power factor
    description: Below it, reactive penalty warning.
  panel_voltage_min:
    name: Alarm - minimum voltage (V)
    description: Minimum phase voltage.
  panel_voltage_max:
    name: Alarm - maximum voltage (V)
    description: Maximum phase voltage.
  panel_unbalance_max:
    name: Alarm - maximum unbalance (%)
    description: Difference between phase currents.
  panel_temp_warn:
    name: Alarm - inverter temperature (°C)
    description: High temperature warning.
  panel_export_alarm:
    name: Alarm - maximum export (W)
    description: With zero export, warn above this power.
