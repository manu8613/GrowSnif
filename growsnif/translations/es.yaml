configuration:
  gateway_host:
    name: Pasarela RS485-TCP (host)
    description: IP o nombre de la pasarela en modo TCP Server transparente. Obligatorio.
  gateway_port:
    name: Puerto de la pasarela
    description: Puerto TCP de la pasarela.
  meter_address:
    name: Dirección Modbus del medidor
    description: Dirección del CHINT en el bus (la ves en su pantalla, menú NO.).
  ct_ratio:
    name: Relación de los trafos de intensidad
    description: 'Primario/secundario. Ej.: 400/5 A = 80. Pon 1 si el medidor es de conexión directa.'
  pt_ratio:
    name: Relación de los trafos de tensión
    description: Normalmente 1 (sin trafos de tensión).
  invert_power_sign:
    name: Invertir signo de potencia
    description: Actívalo si al importar de la red la potencia sale negativa.
  publish_interval:
    name: Intervalo de publicación (s)
    description: Mínimo entre publicaciones de la potencia rápida.
  id_prefix:
    name: Prefijo de entidades
    description: Forma los entity_id (sensor.<prefijo>_...) y los temas MQTT. Si ya tenías entidades, pon su prefijo para conservar el historial.
  device_name:
    name: Nombre del dispositivo
    description: Nombre que verás en Home Assistant.
  discovery_prefix:
    name: Prefijo de MQTT Discovery
    description: Déjalo en homeassistant salvo que lo hayas cambiado en la integración MQTT.
  mqtt_host:
    name: MQTT host (opcional)
    description: Vacío = credenciales automáticas del Supervisor (Mosquitto).
  mqtt_port:
    name: MQTT puerto (opcional)
    description: Solo si rellenas el host.
  mqtt_username:
    name: MQTT usuario (opcional)
    description: Vacío = automático.
  mqtt_password:
    name: MQTT contraseña (opcional)
    description: Vacío = automático.
  log_level:
    name: Nivel de log
    description: info recomendado.
  inverter_enabled:
    name: Inversor - activar
    description: Escucha también el bus datalogger ↔ inversor Growatt por un segundo canal de la pasarela. Desactivado no cambia nada.
  inverter_host:
    name: Inversor - host de la pasarela
    description: Vacío = el mismo que gateway_host (pasarela de varios canales).
  inverter_port:
    name: Inversor - puerto del canal
    description: Puerto TCP del canal conectado al bus del inversor. Distinto del del medidor.
  inverter_address:
    name: Inversor - dirección Modbus
    description: Dirección del inversor en su bus (la ves en la pantalla o en la web del datalogger). Suele ser 1.
  inverter_mppts:
    name: Inversor - número de MPPT
    description: Entradas MPPT que quieres ver (1-16). Mira la hoja de datos del inversor.
  inverter_strings:
    name: Inversor - número de strings
    description: Strings a vigilar (0-32). 0 = sin sensores por string ni avisos de string desconectado.
  inverter_id_prefix:
    name: Inversor - prefijo de entidades
    description: Forma los entity_id (sensor.<prefijo>_...). Distinto de id_prefix.
  inverter_device_name:
    name: Inversor - nombre del dispositivo
    description: Nombre que verás en Home Assistant.
  panel_install:
    name: Panel - instalar
    description: Crea el panel Centro de control (Control, Ahorro e Impacto) y mantiene la tarjeta actualizada. Necesita los permisos de configuración y API, que solo se usan con esto activado.
  panel_mode:
    name: Panel - modo
    description: 'una_vez: lo crea una vez y respeta lo que cambies después. gestionado: estas opciones mandan y el panel se reescribe al cambiarlas, guardando antes una copia en /config/growsnif/backups.'
  panel_url:
    name: Panel - dirección
    description: Ruta del panel, con al menos un guion (p. ej. growsnif-control).
  panel_title:
    name: Panel - título
    description: Título de la cabecera.
  panel_subtitle:
    name: Panel - subtítulo
    description: Texto bajo el título (opcional).
  panel_sidebar_title:
    name: Panel - nombre en la barra lateral
    description: Nombre del panel en el menú de Home Assistant.
  panel_icon:
    name: Panel - icono
    description: Icono mdi del menú (p. ej. mdi:transmission-tower).
  panel_nominal_power:
    name: Panel - potencia nominal (W)
    description: Potencia nominal del inversor en vatios.
  panel_strings_per_mppt:
    name: Panel - strings por MPPT
    description: 0 = reparto automático entre los MPPT.
  panel_zero_export:
    name: Panel - vertido cero
    description: Avisa si se vierte energía a la red.
  panel_lines:
    name: Panel - líneas medidas
    description: 'Una por línea: name, power (entidad de potencia) y, si quieres, code, energy, current y max (W).'
  panel_savings:
    name: Panel - pestaña Ahorro
    description: Muestra el ahorro hora a hora con los precios de cada periodo.
  panel_impact:
    name: Panel - pestaña Impacto
    description: Muestra el CO₂ evitado y sus equivalencias.
  panel_price_entities:
    name: Panel - precios P1 a P6
    description: Seis entidades con el precio de la energía de cada periodo (€/kWh), en orden.
  panel_price_kwh:
    name: Panel - precio único (€/kWh)
    description: Si no tienes los seis precios. 0 = sin precio.
  panel_price_now_entity:
    name: Panel - precio actual
    description: Entidad con el precio de la energía en este momento (opcional).
  panel_cost_entity:
    name: Panel - coste acumulado
    description: Entidad del coste acumulado de la energía, para comparar con lo pagado (opcional).
  panel_tax_factor:
    name: Panel - factor de impuestos
    description: Multiplica el ahorro. 1 = sin impuestos.
  panel_co2_entity:
    name: Panel - intensidad de CO₂
    description: Entidad en g/kWh (p. ej. Electricity Maps), opcional.
  panel_co2_factor:
    name: Panel - CO₂ por kWh (g)
    description: Valor fijo cuando no hay entidad de CO₂.
  panel_pf_min:
    name: Alarma - cos φ mínimo
    description: Por debajo avisa de penalización por reactiva.
  panel_voltage_min:
    name: Alarma - tensión mínima (V)
    description: Tensión fase-neutro mínima.
  panel_voltage_max:
    name: Alarma - tensión máxima (V)
    description: Tensión fase-neutro máxima.
  panel_unbalance_max:
    name: Alarma - desequilibrio máximo (%)
    description: Diferencia entre corrientes de fase.
  panel_temp_warn:
    name: Alarma - temperatura del inversor (°C)
    description: Aviso por temperatura alta.
  panel_export_alarm:
    name: Alarma - vertido máximo (W)
    description: Con vertido cero, avisa por encima de esta potencia.
